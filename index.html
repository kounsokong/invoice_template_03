<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional A5 Invoice</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700&display=swap');

  @page {
    size: A5 portrait;
    margin: 0;
  }

  body {
    margin: 0;
    padding: 5mm;
    font-family: "Khmer OS Battambang", "Noto Sans Khmer", Arial, sans-serif;
    font-size: 12px;
    color: #c0392b;
    line-height: 1.5;
    background-color: #f0f0f0;
  }

  .english-font {
    font-family: Arial, sans-serif !important;
  }

  .invoice-container {
    padding: 8mm;
    width: 148mm;
    min-height: 210mm;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    background-color: #fff;
    margin: 0 auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  /* HEADER SECTION */
  .header {
    position: relative;
    margin-bottom: 15px;
  }

  .header-image {
    text-align: center;
    margin-bottom: 15px;
  }

  .header-image img {
    max-width: 100%;
    max-height: 120px;
    object-fit: contain;
  }

  .title-center {
    text-align: center;
    margin-bottom: 10px;
  }

  .title-center h1 {
    margin: 0;
    font-family: "Khmer OS Muol Light", "Noto Sans Khmer", serif;
    font-size: 18px;
    line-height: 1.2;
    text-transform: uppercase;
  }

  .title-center span {
    font-size: 16px;
    font-weight: bold;
    display: block;
    letter-spacing: 2px;
  }

  .invoice-info {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    gap: 15px;
  }

  .bill-to {
    flex: 0 0 60%;
    font-size: 12px;
    line-height: 1.6;
  }

  .bill-to-item {
    margin-bottom: 2px;
  }

  .bill-to-label {
    display: inline-block;
    min-width: 65px;
    font-weight: 600;
  }

  .meta-right {
    text-align: right;
    font-size: 12px;
    flex: 0 0 35%;
  }

  /* TABLE STYLES */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 5px;
    table-layout: fixed;
  }

  th {
    border: 1.5px solid #c0392b;
    background-color: rgba(192, 57, 43, 0.08);
    padding: 5px 3px;
    font-size: 10px;
  }

  td {
    border: 1px solid #c0392b;
    padding: 4px 5px;
    font-size: 12px;
    word-wrap: break-word;
  }

  .text-center { text-align: center; }
  .text-right { text-align: right; font-family: Arial, sans-serif; }

  .col-no { width: 35px; }
  .col-desc { width: auto; }
  .col-qty { width: 45px; }
  .col-price { width: 70px; }
  .col-total { width: 85px; }

  /* SUMMARY & REMARKS */
  .summary-container {
    margin-top: 10px;
  }

  .bottom-layout {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  .remarks-box {
    width: 48%;
    border: 1px dashed #c0392b;
    padding: 6px 8px;
    min-height: 60px;
    font-size: 10px;
  }

  .total-calc {
    width: 48%;
  }

  .calc-item {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
    font-size: 12px;
  }

  .balance-row {
    border-top: 2px solid #c0392b;
    margin-top: 4px;
    padding-top: 4px;
    font-weight: bold;
    font-size: 14px;
  }

  .value { font-family: Arial, sans-serif; }

  /* SIGNATURES */
  .signature-section {
    display: flex;
    justify-content: space-between;
    margin-top: 30px;
    text-align: center;
  }

  .signature-box { width: 45%; }
  .signature-space {
    height: 40px;
    border-bottom: 1.5px solid #c0392b;
    margin-bottom: 6px;
  }

  .date-line { font-size: 10px; margin-bottom: 8px; }

  /* PRINT RULES - FIX FOR MOBILE */
  @media print {
    body {
      background-color: white !important;
      margin: 0 !important;
      padding: 0 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .print-button { display: none !important; }

    .invoice-container {
      width: 148mm !important;
      height: 210mm !important;
      margin: 0 !important;
      padding: 8mm !important;
      box-shadow: none !important;
      display: flex !important;
      flex-direction: column !important;
    }

    .invoice-info, .bottom-layout, .signature-section {
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-between !important;
    }

    .bill-to, .remarks-box, .signature-box { width: 48% !important; }
    .meta-right, .total-calc { width: 48% !important; }
  }

  /* Screen Adjustment for smaller displays */
  @media screen and (max-width: 148mm) {
    body { padding: 0; background: #fff; }
    .invoice-container { width: 100%; min-height: auto; box-shadow: none; padding: 5mm; }
  }

  .print-button {
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: #c0392b;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 5px;
    z-index: 1000;
  }
</style>
</head>

<body>

<button class="print-button" onclick="window.print()">🖨️ Print Invoice</button>

<div class="invoice-container">
  <div class="header">
    <div class="header-image" id="header-image-container"></div>
    <div class="title-center">
      <h1>វិក្កយបត្រ</h1>
      <span>INVOICE</span>
    </div>

    <div class="invoice-info">
      <div class="bill-to">
        <div class="bill-to-item"><span class="bill-to-label">Company:</span> <span id="company_name"></span></div>
        <div class="bill-to-item"><span class="bill-to-label">Att:</span> <span id="contact_name"></span></div>
        <div class="bill-to-item"><span class="bill-to-label">Address:</span> <span id="address"></span></div>
        <div class="bill-to-item"><span class="bill-to-label">Tel:</span> <span id="phone_number" class="english-font"></span></div>
      </div>
      <div class="meta-right">
        <div>No: <strong id="invoice_no" class="english-font"></strong></div>
        <div>Date: <strong id="invoice_date" class="english-font"></strong></div>
      </div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th class="col-no">No</th>
        <th class="col-desc">Description</th>
        <th class="col-qty">Qty</th>
        <th class="col-price">Price</th>
        <th class="col-total">Amount</th>
      </tr>
    </thead>
    <tbody id="line-items"></tbody>
  </table>

  <div class="summary-container">
    <div class="bottom-layout">
      <div class="remarks-box">
        <strong style="text-decoration: underline;">Remarks:</strong>
        <div id="remarks" style="white-space: pre-wrap; margin-top: 4px;"></div>
      </div>
      <div class="total-calc">
        <div class="calc-item"><span>Subtotal:</span> <strong class="value" id="subtotal"></strong></div>
        <div class="calc-item"><span>Deposit:</span> <strong class="value" id="deposit"></strong></div>
        <div class="calc-item balance-row"><span>Balance:</span> <strong class="value" id="balance"></strong></div>
      </div>
    </div>

    <div class="signature-section">
      <div class="signature-box">
        <div class="date-line">ថ្ងៃទី .......... ខែ .......... ឆ្នាំ 202...</div>
        <strong>Buyer</strong>
        <div class="signature-space"></div>
      </div>
      <div class="signature-box">
        <div class="date-line">ថ្ងៃទី .......... ខែ .......... ឆ្នាំ 202...</div>
        <strong>Seller</strong>
        <div class="signature-space"></div>
      </div>
    </div>
  </div>
</div>

<script>
function getUrlParams() {
  const params = new URLSearchParams(window.location.search);
  return {
    header_image: params.get('header_image') || '',
    invoice_no: params.get('invoice_no') || '',
    invoice_date: params.get('invoice_date') || '',
    company_name: params.get('company_name') || '',
    contact_name: params.get('contact_name') || '',
    address: params.get('address') || '',
    phone_number: params.get('phone_number') || '',
    line_items: params.get('line_items') || '[]',
    remarks: params.get('remarks') || '',
    subtotal: params.get('subtotal') || '',
    deposit: params.get('deposit') || '',
    balance: params.get('balance') || ''
  };
}

function populateInvoice() {
  const data = getUrlParams();
  
  if (data.header_image) {
    const img = document.createElement('img');
    img.src = decodeURIComponent(data.header_image);
    document.getElementById('header-image-container').appendChild(img);
  }

  document.getElementById('invoice_no').textContent = data.invoice_no;
  document.getElementById('invoice_date').textContent = data.invoice_date;
  document.getElementById('company_name').textContent = data.company_name;
  document.getElementById('contact_name').textContent = data.contact_name;
  document.getElementById('address').textContent = data.address;
  document.getElementById('phone_number').textContent = data.phone_number;
  document.getElementById('remarks').textContent = data.remarks;
  document.getElementById('subtotal').textContent = data.subtotal;
  document.getElementById('deposit').textContent = data.deposit;
  document.getElementById('balance').textContent = data.balance;

  try {
    const items = JSON.parse(decodeURIComponent(data.line_items));
    const tbody = document.getElementById('line-items');
    items.forEach((item, index) => {
      const row = `<tr>
        <td class="text-center">${index + 1}</td>
        <td>${item.description || item.name || ''}</td>
        <td class="text-center">${item.qty || ''}</td>
        <td class="text-right">${item.price || ''}</td>
        <td class="text-right">${item.amount || ''}</td>
      </tr>`;
      tbody.innerHTML += row;
    });
  } catch (e) { console.error("Line items error", e); }
}

document.addEventListener('DOMContentLoaded', populateInvoice);
</script>
</body>
</html>
